name: microly-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: microly
      POSTGRES_USER: microly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microly -d microly"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]

  migrate:
    image: microly-api:${MICROLY_OPERATIONS_IMAGE_TAG:?MICROLY_OPERATIONS_IMAGE_TAG is required}
    env_file: ${MICROLY_ENV_FILE:-.env.production}
    command: ["node", "apps/api/dist/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  seed:
    image: microly-api:${MICROLY_OPERATIONS_IMAGE_TAG:?MICROLY_OPERATIONS_IMAGE_TAG is required}
    env_file: ${MICROLY_ENV_FILE:-.env.production}
    command: ["node", "apps/api/dist/scripts/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data]
    restart: "no"

  api:
    image: microly-api:${MICROLY_IMAGE_TAG:?MICROLY_IMAGE_TAG is required}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${MICROLY_ENV_FILE:-.env.production}
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [data, edge]

  gateway:
    image: microly-gateway:${MICROLY_IMAGE_TAG:?MICROLY_IMAGE_TAG is required}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_ORIGIN:?API_PUBLIC_ORIGIN is required}
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  backup:
    image: microly-api:${MICROLY_OPERATIONS_IMAGE_TAG:?MICROLY_OPERATIONS_IMAGE_TAG is required}
    env_file: ${MICROLY_ENV_FILE:-.env.production}
    command: ["node", "apps/api/dist/scripts/backup-worker.js"]
    restart: unless-stopped
    user: "0:0"
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ${BACKUP_HOST_DIR:-./backups-production}:/backups
    networks: [data]

  postgres-restore:
    image: postgres:17-alpine
    profiles: [restore]
    environment:
      POSTGRES_DB: microly_restore
      POSTGRES_USER: microly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microly -d microly_restore"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_restore_data:/var/lib/postgresql/data
    networks: [data]

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  postgres_restore_data:
  caddy_data:
  caddy_config:
