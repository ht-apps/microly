services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: microly
      POSTGRES_USER: microly
      POSTGRES_PASSWORD: microly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microly -d microly"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - microly_postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: microly_test
      POSTGRES_USER: microly
      POSTGRES_PASSWORD: microly
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microly -d microly_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    profiles: ["test"]

volumes:
  microly_postgres_data:
